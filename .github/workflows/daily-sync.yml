name: Daily Garmin Sync

on:
  schedule:
    # Split into individual crons so we can identify the trigger time
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      profile:
        description: 'Select User Profile'
        required: true
        default: 'USER1'
        type: choice
        options:
        - USER1
        - USER2
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: false
      output_type:
        description: 'Output Destination'
        required: true
        default: 'drive'
        type: choice
        options:
        - drive
        - sheets

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Daylight Saving Time Filter
      id: dst-filter
      run: |
        if [ "${{ github.event_name }}" == "schedule" ]; then
          IS_BST=$(TZ='Europe/London' date +%Z)
          SCHEDULE="${{ github.event.schedule }}"
          
          if [ "$IS_BST" == "BST" ] && [ "$SCHEDULE" == "0 9 * * *" ]; then
            echo "BST active. Skipping the 09:00 UTC (10:00 BST) scheduled run."
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [ "$IS_BST" == "GMT" ] && [ "$SCHEDULE" == "0 5 * * *" ]; then
            echo "GMT active. Skipping the 05:00 UTC (05:00 GMT) scheduled run."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Scheduled time ($SCHEDULE) is within the 06:00-09:00 UK time window. Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "Manual trigger detected. Proceeding."
          echo "should_run=true" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      if: steps.dst-filter.outputs.should_run == 'true'
      uses: actions/checkout@v4

    - name: Setup Node
      if: steps.dst-filter.outputs.should_run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      if: steps.dst-filter.outputs.should_run == 'true'
      run: npm install

    - name: Run Sync
      if: steps.dst-filter.outputs.should_run == 'true'
      env:
        WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
        WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
        GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
      run: node index.js

    - name: Commit and Push Updated Tokens
      if: steps.dst-filter.outputs.should_run == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .withings2gsheets/*
        git commit -m "chore: Update Withings tokens and timestamps" || echo "No changes to commit"
        git push

    - name: Upload Sync Logs
      if: steps.dst-filter.outputs.should_run == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: withings-sync-logs
        path: sync-debug.log
        retention-days: 5
