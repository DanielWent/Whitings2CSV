name: Withings Daily Sync

on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch:
    inputs:
      reset_sync:
        description: 'Set to "true" to wipe history and re-sync everything'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Dependencies
      run: npm install

    - name: Create Service Account File
      run: |
        mkdir -p .withings2gsheets
        echo '${{ secrets.GDRIVE_CREDS }}' > .withings2gsheets/withings2gsheets-service-account.json

    - name: Handle Reset (If Requested)
      if: github.event.inputs.reset_sync == 'true'
      run: node reset.js

    - name: Run Sync
      env:
        WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
        WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
      run: node index.js

    - name: Commit Updated State
      if: success()
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add .withings2gsheets/
        git commit -m "Auto-update Withings state [skip ci]" || exit 0
        git push
