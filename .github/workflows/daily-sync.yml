name: Daily Garmin Sync

on:
  schedule:
    - cron: '15 6,7 * * 1-5'
    - cron: '30 7,8 * * 0,6'
    - cron: '0 11,12,16,17,18,19 * * *'
  
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select User Profile'
        required: true
        default: 'USER1'
        type: choice
        options:
        - USER1
        - USER2
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: false
      output_type:
        description: 'Output Destination'
        required: true
        default: 'drive'
        type: choice
        options:
        - drive
        - sheets

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Daylight Saving Time Filter
      id: dst-filter
      run: |
        if [ "${{ github.event_name }}" == "schedule" ]; then
          UK_HOUR=$(TZ='Europe/London' date +%H)
          UK_DAY=$(TZ='Europe/London' date +%u) 
          
          SHOULD_RUN=false
          
          if [[ "$UK_DAY" -le 5 ]]; then
            if [[ "$UK_HOUR" == "07" || "$UK_HOUR" == "12" || "$UK_HOUR" == "17" || "$UK_HOUR" == "19" ]]; then
              SHOULD_RUN=true
            fi
          else
            if [[ "$UK_HOUR" == "08" || "$UK_HOUR" == "12" || "$UK_HOUR" == "17" || "$UK_HOUR" == "19" ]]; then
              SHOULD_RUN=true
            fi
          fi
          
          if [ "$SHOULD_RUN" == "false" ]; then
            echo "Current UK time is $UK_HOUR:$(TZ='Europe/London' date +%M) on day $UK_DAY. Exiting early to prevent redundant execution."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        echo "should_run=true" >> $GITHUB_OUTPUT

    # --- YOUR STANDARD REPO CHECKOUT AND RUN STEPS GO HERE ---
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Run Sync
      run: node index.js
    # ---------------------------------------------------------

    # THIS IS THE CRITICAL NEW STEP: It uploads the log file created by index.js
    - name: Upload Sync Logs
      if: always() # This ensures the log uploads even if Node crashes and fails the step above
      uses: actions/upload-artifact@v4
      with:
        name: withings-sync-logs
        path: sync-debug.log
        retention-days: 5
