name: Daily Garmin Sync

on:
  schedule:
    # Weekdays: 7:15 AM UK time (06:15 UTC in BST, 07:15 UTC in GMT)
    - cron: '15 6,7 * * 1-5'
    # Weekends: 8:30 AM UK time (07:30 UTC in BST, 08:30 UTC in GMT)
    - cron: '30 7,8 * * 0,6'
    # Everyday: 12:00 PM, 5:00 PM, 7:00 PM UK time (covers both GMT and BST offsets)
    - cron: '0 11,12,16,17,18,19 * * *'
  
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select User Profile'
        required: true
        default: 'USER1'
        type: choice
        options:
        - USER1
        - USER2
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: false
      output_type:
        description: 'Output Destination'
        required: true
        default: 'drive'
        type: choice
        options:
        - drive
        - sheets

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Daylight Saving Time Filter
      id: dst-filter
      run: |
        # Only run this check for scheduled cron jobs, allowing manual dispatches to run anytime
        if [ "${{ github.event_name }}" == "schedule" ]; then
          UK_HOUR=$(TZ='Europe/London' date +%H)
          UK_DAY=$(TZ='Europe/London' date +%u) # 1-7, where 1 is Monday
          
          SHOULD_RUN=false
          
          # Weekdays (Monday to Friday)
          if [[ "$UK_DAY" -le 5 ]]; then
            if [[ "$UK_HOUR" == "07" || "$UK_HOUR" == "12" || "$UK_HOUR" == "17" || "$UK_HOUR" == "19" ]]; then
              SHOULD_RUN=true
            fi
          # Weekends (Saturday and Sunday)
          else
            if [[ "$UK_HOUR" == "08" || "$UK_HOUR" == "12" || "$UK_HOUR" == "17" || "$UK_HOUR" == "19" ]]; then
              SHOULD_RUN=true
            fi
          fi
          
          if [ "$SHOULD_RUN" == "false" ]; then
            echo "Current UK time is $UK_HOUR:$(TZ='Europe/London' date +%M) on day $UK_DAY. Exiting early to prevent redundant execution."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        echo "should_run=true" >> $GITHUB_OUTPUT

    # ... [Keep the rest of your existing steps starting from "Checkout code"] ...
