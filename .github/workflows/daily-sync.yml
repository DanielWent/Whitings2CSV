name: Withings Daily Sync

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Dependencies
      run: npm install

    - name: Create Service Account File
      run: |
        mkdir -p .withings2gsheets
        echo '${{ secrets.GDRIVE_CREDS }}' > .withings2gsheets/withings2gsheets-service-account.json

    - name: Run Sync
      # UPDATE: Pass the secrets as environment variables here
      env:
        WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
        WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
      run: node index.js

    - name: Commit Updated Tokens
      if: success()
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add .withings2gsheets/withings2gsheetstokens.json
        git commit -m "Auto-update Withings tokens [skip ci]" || exit 0
        git push
